<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soạn Bài Đăng Hoạt Động - KIDPRO Teacher Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #275A4E; --primary-dark: #1E4D40; --accent: #E5A93C;
            --mint: #78C2AD; --bg: #F4F7F6; --card: #FFFFFF;
            --text-main: #1C2D27; --text-muted: #64748B;
            --danger: #DC3545; --success: #10B981; --warning: #F59E0B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #E2E8F0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 0;
        }
        .mobile-container {
            width: 100%; max-width: 420px; min-height: 844px; background: var(--bg);
            border-radius: 36px; box-shadow: 0 16px 40px rgba(0,0,0,0.15); border: 8px solid #1E293B;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .status-bar {
            height: 44px; background: var(--card); display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; font-size: 13px; font-weight: 700; color: var(--text-main); flex-shrink: 0;
        }
        .app-header {
            height: 54px; background: var(--card); border-bottom: 1px solid #EEF3F0;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0;
        }
        .app-body {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
        }
        .bottom-nav {
            height: 64px; background: var(--card); border-top: 1px solid #EEF3F0;
            display: flex; align-items: center; justify-content: space-around; flex-shrink: 0;
        }
        .m-card {
            background: #FFF; border-radius: 16px; padding: 16px; border: 1px solid #E1E8E5; box-shadow: 0 2px 6px rgba(39,90,78,0.04);
        }
        .btn-m {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 16px; font-size: 13px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; text-decoration: none;
        }
        .btn-m-primary { background: var(--primary); color: #FFF; }
        .btn-m-outline { background: transparent; border: 1px solid #CBD5E1; color: var(--text-main); }
        .btn-m-danger { background: var(--danger); color: #FFF; }
        .status-pill {
            padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;
        }
        .status-pill.success { background: #D1FAE5; color: #065F46; }
        .status-pill.warning { background: #FEF3C7; color: #92400E; }
        .status-pill.danger { background: #FDE8E9; color: #991B1B; }
        .status-pill.info { background: #E0F2FE; color: #075985; }
        @media(max-width: 480px) {
            body { padding: 0; }
            .mobile-container { border: none; border-radius: 0; min-height: 100vh; }
        }
    
    /* ===== RESPONSIVE & ANTI-CLIPPING FIX FOR KIDPRO SUITE ===== */
    .admin-main { flex: 1; min-width: 0; overflow-x: auto; display: flex; flex-direction: column; }
    .admin-content { padding: 20px 24px; min-width: 0; }
    .main-wrapper { min-width: 0; overflow-x: auto; }
    .content-area { min-width: 0; }
    .tablet-main { min-width: 0; overflow-x: auto; }

    @media (max-width: 1200px) {
      .admin-sidebar { width: 220px !important; }
      .admin-content { padding: 18px 20px !important; }
      .sidebar { width: 220px !important; }
      .main-wrapper { margin-left: 220px !important; }
      .content-area { padding: 18px 20px !important; }
    }

    @media (max-width: 900px) {
      .admin-sidebar { width: 190px !important; }
      .admin-content { padding: 14px 16px !important; }
      .sidebar { width: 190px !important; }
      .main-wrapper { margin-left: 190px !important; }
      .content-area { padding: 14px 16px !important; }
    }

    /* Đảm bảo các hàng nút bấm, filter, card header luôn wrap mượt mà */
    .admin-content > div[style*="display: flex"],
    .admin-content > div[style*="display:flex"],
    .admin-content div[style*="justify-content: space-between"],
    .admin-content div[style*="justify-content:space-between"],
    .admin-content div[style*="gap:"],
    .admin-content div[style*="gap :"],
    .content-area > div[style*="display: flex"],
    .content-area > div[style*="display:flex"],
    .content-area div[style*="justify-content: space-between"],
    .content-area div[style*="justify-content:space-between"],
    .content-area div[style*="gap:"],
    .content-area div[style*="gap :"],
    .tablet-content > div[style*="display: flex"],
    .tablet-content div[style*="justify-content: space-between"],
    .tablet-content div[style*="gap:"] {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .admin-topbar, .topbar {
      flex-wrap: wrap !important;
      gap: 10px !important;
      height: auto !important;
      min-height: 64px !important;
      padding-top: 10px !important;
      padding-bottom: 10px !important;
    }

    .card-header {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* ========================================================== */

  </style>
</head>
<body>

        <!-- BOTTOM NAVIGATION -->

            Lớp học
            
        </a>
        
        <a href="screen_082.html" style="flex: 1; text-align: center; text-decoration: none; padding: 8px 0; font-size: 10.5px; position: relative; color: #8B9E96;">

        <a href="screen_087.html" style="flex: 1; text-align: center; text-decoration: none; padding: 8px 0; font-size: 10.5px; position: relative; color: #8B9E96;">

        <a href="screen_097.html" style="flex: 1; text-align: center; text-decoration: none; padding: 8px 0; font-size: 10.5px; position: relative; color: #275A4E; font-weight: 700;">
            <i class="bi bi-cup-hot-fill" style="font-size: 19px; display: block; margin-bottom: 2px;"></i>
            Bán trú
            
        </a>
        
        <a href="screen_106.html" style="flex: 1; text-align: center; text-decoration: none; padding: 8px 0; font-size: 10.5px; position: relative; color: #8B9E96;">
            <i class="bi bi-chat-dots-fill" style="font-size: 19px; display: block; margin-bottom: 2px;"></i>
            Tin nhắn
            <span style="position: absolute; top: 4px; right: 22px; background: #DC3545; color: #FFF; width: 15px; height: 15px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800;">3</span>

        </nav>
    </div>
</body>
</html>
