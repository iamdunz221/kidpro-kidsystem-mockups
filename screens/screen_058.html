<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu Kế Toán - KIDPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --primary: #275A4E; --primary-dark: #1E4D40; --bg: #F4F7F6; --border: #E1E8E5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 480px; background: #FFF; border-radius: 18px; border: 1px solid var(--border); padding: 36px; box-shadow: 0 10px 30px rgba(39,90,78,0.08); }
        .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .otp-box { width: 46px; height: 52px; border: 1.5px solid var(--border); border-radius: 10px; text-align: center; font-size: 20px; font-weight: 800; color: var(--primary); outline: none; }
        .btn-submit { width: 100%; padding: 13px; background: var(--primary); color: #FFF; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(39,90,78,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 10px;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 style="font-size: 19px; font-weight: 800; color: #1C2D27;">Khôi phục tài khoản Kế toán</h3>
            <p style="font-size: 13px; color: #64748B; margin-top: 4px;">Mã xác thực đã được gửi đến email công vụ được phê chuẩn</p>
        </div>

        <div style="background: #F8FAF9; border-radius: 10px; padding: 12px; border: 1px solid var(--border); font-size: 12.5px; margin-bottom: 16px;">
            <div style="font-weight: 700; color: var(--primary);"><i class="bi bi-envelope-check"></i> ketoan@tanbinh.kidpro.edu.vn</div>
            <div style="color: #64748B; margin-top: 2px;">Kế toán trưởng: Nguyễn Thị Bích Ngọc (MN Thực Nghiệm Tân Bình)</div>
        </div>

        <div class="otp-inputs">
            <input type="text" maxlength="1" class="otp-box" value="6">
            <input type="text" maxlength="1" class="otp-box" value="2">
            <input type="text" maxlength="1" class="otp-box" value="9">
            <input type="text" maxlength="1" class="otp-box" value="1">
            <input type="text" maxlength="1" class="otp-box" value="5">
            <input type="text" maxlength="1" class="otp-box" value="8">
        </div>

        <div style="text-align: center; font-size: 12px; color: #64748B; margin-bottom: 18px;">
            Gửi lại mã OTP sau: <strong style="color: var(--primary);">02:30</strong>
        </div>

        <a href="screen_061.html" class="btn-submit">
            Xác nhận mã OTP & Đặt mật khẩu mới
        </a>

        <div style="text-align: center; margin-top: 18px;">
            <a href="screen_057.html" style="font-size: 12.5px; color: #64748B; text-decoration: none; font-weight: 600;">
                <i class="bi bi-arrow-left"></i> Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</body>
</html>
