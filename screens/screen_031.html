<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Giáo Vụ - KIDPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F4F7F6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 440px; background: #FFF; border-radius: 16px; border: 1px solid #E1E8E5; padding: 36px; box-shadow: 0 10px 25px rgba(39,90,78,0.08); }
        .form-control { width: 100%; padding: 11px 14px; border: 1px solid #CBD5E1; border-radius: 8px; margin-top: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #275A4E; color: #FFF; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 18px; }
        .btn-submit:hover { background: #1E4D40; }
    
    /* ===== RESPONSIVE & ANTI-CLIPPING FIX FOR KIDPRO SUITE ===== */
    .admin-main { flex: 1; min-width: 0; overflow-x: auto; display: flex; flex-direction: column; }
    .admin-content { padding: 20px 24px; min-width: 0; }
    .main-wrapper { min-width: 0; overflow-x: auto; }
    .content-area { min-width: 0; }
    .tablet-main { min-width: 0; overflow-x: auto; }

    @media (max-width: 1200px) {
      .admin-sidebar { width: 220px !important; }
      .admin-content { padding: 18px 20px !important; }
      .sidebar { width: 220px !important; }
      .main-wrapper { margin-left: 220px !important; }
      .content-area { padding: 18px 20px !important; }
    }

    @media (max-width: 900px) {
      .admin-sidebar { width: 190px !important; }
      .admin-content { padding: 14px 16px !important; }
      .sidebar { width: 190px !important; }
      .main-wrapper { margin-left: 190px !important; }
      .content-area { padding: 14px 16px !important; }
    }

    /* Đảm bảo các hàng nút bấm, filter, card header luôn wrap mượt mà */
    .admin-content > div[style*="display: flex"],
    .admin-content > div[style*="display:flex"],
    .admin-content div[style*="justify-content: space-between"],
    .admin-content div[style*="justify-content:space-between"],
    .admin-content div[style*="gap:"],
    .admin-content div[style*="gap :"],
    .content-area > div[style*="display: flex"],
    .content-area > div[style*="display:flex"],
    .content-area div[style*="justify-content: space-between"],
    .content-area div[style*="justify-content:space-between"],
    .content-area div[style*="gap:"],
    .content-area div[style*="gap :"],
    .tablet-content > div[style*="display: flex"],
    .tablet-content div[style*="justify-content: space-between"],
    .tablet-content div[style*="gap:"] {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .admin-topbar, .topbar {
      flex-wrap: wrap !important;
      gap: 10px !important;
      height: auto !important;
      min-height: 64px !important;
      padding-top: 10px !important;
      padding-bottom: 10px !important;
    }

    .card-header {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* ========================================================== */

  </style>
</head>
<body>
    <div class="login-box">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: #275A4E; color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; margin: 0 auto 10px;">K</div>
            <h2 style="font-size: 19px; font-weight: 800; color: #1C2D27;">Cổng Cán Bộ Giáo Vụ</h2>
            <div style="font-size: 12.5px; color: #64748B;">Trường Mầm Non Thực Nghiệm Tân Bình</div>
        </div>
        <form action="screen_033.html">
            <div style="margin-bottom: 14px;">
                <label style="font-size: 13px; font-weight: 600;">Email công vụ</label>
                <input type="email" class="form-control" value="giaovu@tanbinh.kidpro.edu.vn">
            </div>
            <div style="margin-bottom: 14px;">
                <div style="display:flex; justify-content:space-between;">
                    <label style="font-size: 13px; font-weight: 600;">Mật khẩu</label>
                    <a href="screen_032.html" style="font-size: 12px; color: #275A4E; text-decoration: none;">Quên mật khẩu?</a>
                </div>
                <input type="password" class="form-control" value="••••••••••••">
            </div>
            <button type="submit" class="btn-submit"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập Giáo Vụ</button>
        </form>
    </div>
</body>
</html>
